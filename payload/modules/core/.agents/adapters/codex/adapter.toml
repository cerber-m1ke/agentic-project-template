# Adapter manifest: how Codex CLI sees the canonical sources in .agents/.
# Applied per machine by `Toolbox/tb agents link codex`; checked by `Toolbox/tb agents doctor`.
# Renderer: Toolbox/agentic/adapters/codex.py. Managed by the template — do not edit by hand.
# Codex reads the project .codex/ only when the project is trusted.

name = "codex"
title = "Codex CLI"
tier = 3                       # 0 AGENTS.md only, 1 + native skills, 2 + subagents, 3 + hooks
outputs = ["/.codex/"]         # generated paths; must be in the project .gitignore block
link_hint = "Codex reads .codex/ only in trusted projects; approve new hooks once in /hooks; restart Codex to apply changed rules."

[instructions]
mode = "native"                # reads AGENTS.md itself: nothing to generate

[skills]
mode = "native"                # Codex scans <repo>/.agents/skills itself: no links
target = ".agents/skills"
granularity = "none"

[subagents]
target = ".codex/agents"       # <name>.toml: name, description, developer_instructions
# No model names (they change often): the tier sets the reasoning effort only.
reasoning_effort = { fast = "low", balanced = "medium", strong = "high" }
# Codex has no tools list: the tools tier maps to a sandbox mode. `shell` gets workspace-write
# because tb itself writes its cache in Runtime/ (a read-only sandbox would break `tb kb search`);
# read-only subagents such as the librarian keep to reading by their instructions.
sandbox = { read-only = "read-only", shell = "workspace-write", edit = "workspace-write" }

[hooks]
target = ".codex/hooks.json"
# {name} = hook name. Codex runs hooks from the session cwd and has no project-dir variable:
# {tb_find} = `sh -c` that walks up from the cwd to the folder with .agents/agentic.lock and runs
# its Toolbox/tb — no absolute path, so the file stays valid after moving the project, inside a
# dev container and from a subfolder such as Resources/<name>. {tb} = absolute path of Toolbox/tb.
# {tb_cmd} = Toolbox\tb.cmd (relative and unquoted: valid in both cmd and PowerShell, but only
# when the session starts in the project root). New hooks must be approved once in /hooks.
command = "{tb_find} hook {name} --agent codex"
# Tool categories of hooks.toml (`tools`) as matchers. No `edit` yet: which edit tools Codex hooks
# see is not verified, so hooks limited to edits (kb-track) are skipped with a warning.
matchers = {}
command_windows = "{tb_cmd} hook {name} --agent codex"
timeout = 30
events = { session-start = "SessionStart", prompt-submit = "UserPromptSubmit", before-tool = "PreToolUse", after-tool = "PostToolUse", stop = "Stop" }

[memory]
target = ".codex/config.toml"
disable = true                 # [features] memories = false

[mcp]
target = ".codex/config.toml"  # [mcp_servers.<name>]

[permissions]
# [[command]] rules of .agents/permissions.toml as Starlark prefix_rule(...) calls
# (deny -> "forbidden", ask -> "prompt", allow -> "allow"); written only when there are rules.
# [claude] rules are Claude Code only: skipped with a warning.
# Codex reads project rules only in a trusted project; rules are marked experimental (2026).
# Check a command: codex execpolicy check --rules .codex/rules/project.rules -- git push --force
# Restart Codex after the rules change.
target = ".codex/rules/project.rules"
