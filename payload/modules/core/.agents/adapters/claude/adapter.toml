# Adapter manifest: how Claude Code sees the canonical sources in .agents/.
# Applied per machine by `Toolbox/tb agents link claude`; checked by `Toolbox/tb agents doctor`.
# Renderer: Toolbox/agentic/adapters/claude.py. Managed by the template — do not edit by hand.

name = "claude"
title = "Claude Code"
tier = 3                       # 0 AGENTS.md only, 1 + native skills, 2 + subagents, 3 + hooks
outputs = ["/.claude/", "/.mcp.json", "/CLAUDE.md"]   # generated paths; must be in the project .gitignore block

[instructions]
# CLAUDE.md that imports AGENTS.md. Recent Claude Code versions read AGENTS.md themselves when there
# is no CLAUDE.md, older ones only read CLAUDE.md: the import works with both, so no version is
# left without the project instructions. Claude-only notes: .claude/CLAUDE.md or CLAUDE.local.md.
target = "CLAUDE.md"
import = "AGENTS.md"

[skills]
mode = "link"                  # native | link | none
target = ".claude/skills"
granularity = "per-skill"      # .claude/skills/<name> -> .agents/skills/<name> (symlink or junction)

[subagents]
target = ".claude/agents"      # <name>.md with frontmatter name, description, tools, model
models = { fast = "haiku", balanced = "sonnet", strong = "opus" }
tools = { read-only = "Read, Grep, Glob", shell = "Read, Grep, Glob, Bash", edit = "Read, Grep, Glob, Bash, Edit, Write" }

[hooks]
target = ".claude/settings.json"
# {name} = hook name. Hooks run in sh (Git Bash on Windows); stdin JSON has `prompt`,
# stdout of a successful hook is added to the context.
command = '"$CLAUDE_PROJECT_DIR"/Toolbox/tb hook {name} --agent claude'
# Tool categories of hooks.toml (`tools`) as Claude Code matchers.
matchers = { edit = "Write|Edit|MultiEdit|NotebookEdit" }
events = { session-start = "SessionStart", prompt-submit = "UserPromptSubmit", before-tool = "PreToolUse", after-tool = "PostToolUse", stop = "Stop" }

[permissions]
target = ".claude/settings.json"
# Project rules from .agents/permissions.toml are added: a [[command]] prefix becomes
# Bash(<cmd>) and Bash(<cmd> *) under its decision, [claude] rules are copied as is.
# Read-only tb commands that need no confirmation, and `kb commit`: Knowledge is committed right
# after every edit (only Knowledge/ paths, checked by the pre-commit hook).
allow = [
    "Bash(Toolbox/tb kb search *)",
    "Bash(Toolbox/tb kb show *)",
    "Bash(Toolbox/tb kb related *)",
    "Bash(Toolbox/tb kb index*)",
    "Bash(Toolbox/tb kb lint*)",
    "Bash(Toolbox/tb kb stale*)",
    "Bash(Toolbox/tb kb nearby*)",
    "Bash(Toolbox/tb kb commit *)",
    "Bash(Toolbox/tb kb session*)",
    "Bash(Toolbox/tb version)",
    "Bash(Toolbox/tb resources status)",
    "Bash(Toolbox/tb agents doctor)",
    "Bash(Toolbox/tb secrets scan *)",
]

[memory]
target = ".claude/settings.json"
disable = true                 # autoMemoryEnabled = false + CLAUDE_CODE_DISABLE_AUTO_MEMORY=1

[mcp]
target = ".mcp.json"           # written only when .agents/mcp.toml defines servers
